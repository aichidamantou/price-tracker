# │  ┌──────────────────────────────────────────────┐                          │
# │  │  容器: price-tracker-app         端口 8000    │                          │
# │  │  ├─ 后端 API                              │                          │
# │  │  │  ├─ POST /api/upload              Excel上传(两阶段核对)      │                          │
